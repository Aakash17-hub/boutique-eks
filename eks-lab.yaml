apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-lab
  region: ap-southeast-1

availabilityZones: ["ap-southeast-1b", "ap-southeast-1c"]

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: workers
    instanceType: m7i-flex.large
    minSize: 1
    maxSize: 1
    desiredCapacity: 1
    volumeSize: 20