apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployment-manager
  namespace: boutique
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["frontend", "cartservice"]
  verbs: ["get", "list", "watch", "patch"]
# rollout undo / rollout status read ReplicaSets (names are random, so no resourceNames)
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployment-manager
  namespace: boutique
subjects:
- kind: User
  name: arn:aws:sts::<AWS_ACCOUNT_ID>:assumed-role/jenkins-ec2-role/<JENKINS_INSTANCE_ID>
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-deployment-manager
  apiGroup: rbac.authorization.k8s.io
